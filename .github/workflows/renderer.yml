name: Renderer UI suites
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: renderer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run preview:build
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.63.0 pillow==12.3.0
          python -m playwright install --with-deps chromium
      - name: Ten production-renderer suites (synthetic fixtures, no network)
        run: |
          for suite in ui-smoke ui-artifacts ui-inline ui-seamless ui-editing ui-responsive ui-spacing ui-activity ui-account ui-handoff; do
            echo "::group::$suite"
            python "tests/$suite.py"
            echo "::endgroup::"
          done
