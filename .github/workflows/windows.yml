name: Windows client
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Require reviewed dependency lockfile
        shell: pwsh
        run: |
          if (!(Test-Path package-lock.json)) { throw 'Bootstrap dependencies and commit package-lock.json first.' }
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies and the checksum-verified Electron binary
        run: npm run bootstrap
      - run: npm run doctor
      - run: npm test
      - name: Native Windows, DPAPI and PDF print/view smoke test
        run: npm run smoke:desktop
      - name: Package Windows x64
        run: npx --no-install electron-builder --win --x64 --publish never
      - name: Check that every packaged module's dependencies and required peers are packaged
        run: node scripts/check-package.mjs
      - name: Packaged app smoke test (attested SDK import, DPAPI, PDF print/view)
        shell: pwsh
        run: |
          $out = & "release\win-unpacked\Tinfoil Workbench.exe" --smoke-test 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'DESKTOP_SMOKE_OK') { throw 'The packaged app smoke test failed.' }
      - uses: actions/upload-artifact@v7
        with:
          name: Tinfoil-Workbench-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
