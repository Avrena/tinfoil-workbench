name: Android client
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Require reviewed dependency lockfile
        run: test -f package-lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # The Android build does not need the Electron binary that npm run bootstrap downloads.
      - run: npm ci
      - run: npm test
      # The runner image provides ANDROID_HOME with accepted licenses; Gradle installs any missing
      # platform or build-tools package declared by the project.
      - name: Android debug build
        run: node scripts/android-build.mjs --debug
      - name: Android release build (unsigned; release signing happens on the maintainer machine)
        run: node scripts/android-build.mjs
      # Builds are published from the maintainer machine; this copy only helps review. The private repository's
      # artifact storage fills after a few runs, so a failed upload must not fail a job whose checks passed.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: Tinfoil-Workbench-Android-debug
          path: release/*-android-debug.apk
          if-no-files-found: error
          retention-days: 1
