import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// package.json is the single version source: 0.11.0 -> versionName "0.11.0", versionCode 11000.
def packageVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version
def (major, minor, patch) = packageVersion.tokenize('.').collect { it.toInteger() }

// Release signing comes only from the environment (see docs/ANDROID.md); keys never live in the repo.
// TINFOIL_ANDROID_SIGNING may name a properties file with storeFile, storePassword, keyAlias, keyPassword
// and storeType; otherwise the individual TINFOIL_ANDROID_* variables are used.
def signing = new Properties()
def signingFile = System.getenv('TINFOIL_ANDROID_SIGNING')
if (signingFile) file(signingFile).withInputStream { signing.load(it) }
def signingValue = { String property, String variable -> signing.getProperty(property) ?: System.getenv(variable) }
def releaseStore = signingValue('storeFile', 'TINFOIL_ANDROID_KEYSTORE')

android {
    namespace = "org.avrena.tinfoil.workbench"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.avrena.tinfoil.workbench"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode major * 1000000 + minor * 1000 + patch
        versionName packageVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseStore) {
            release {
                storeFile file(releaseStore)
                storeType signingValue('storeType', 'TINFOIL_ANDROID_STORE_TYPE') ?: 'PKCS12'
                storePassword signingValue('storePassword', 'TINFOIL_ANDROID_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'TINFOIL_ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'TINFOIL_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseStore) signingConfig signingConfigs.release
        }
    }
    // Do not embed the Play-encrypted dependency report; the release is distributed as a plain APK.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
